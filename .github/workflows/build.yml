name: Build UEFI (courbet, SM7325)

# The upstream workflow in this fork's history triggered on "master" while the
# branch is "main", so it never ran on a push. This one triggers on the branch
# that actually exists.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Firmware build
    # 22.04 rather than latest: the upstream build expects python3-distutils,
    # which newer runners no longer ship.
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # Recursive: edk2 has its own submodules (BaseTools), and the prebuilt DXE
      # binaries come from a fourth one. Without them the build cannot link.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev clang llvm iasl nasm \
            gcc-aarch64-linux-gnu abootimg \
            python3 python3-distutils python3-pil python3-git gettext \
            cpio zip unzip

      - name: Build firmware
        run: |
          bash ./sweetbuild.sh

      - name: Build device tree variants
        run: |
          chmod +x package_variants.sh
          bash ./package_variants.sh

      - name: Verify each variant
        run: |
          set -e
          for img in out/*.img; do
            case "$img" in *-128m.img) continue ;; esac
            echo "=== $img ==="
            python3 tools/verify_boot_image.py "$img"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: courbet-uefi
          path: out/
          if-no-files-found: error
          retention-days: 30