name: Build UEFI (courbet, SM7325)

# The upstream workflow in this fork's history triggered on "master" while the
# branch is "main", so it never ran on a push. This one triggers on the branch
# that actually exists.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Firmware build
    # 22.04 rather than latest: the upstream build expects python3-distutils,
    # which newer runners no longer ship.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Not recursive: see fetch_submodules.sh. One of edk2's nested
          # submodules points at a repository that no longer exists, and a plain
          # recursive checkout aborts the whole job on it.
          submodules: false
          fetch-depth: 0

      - name: Fetch submodules
        run: bash ./fetch_submodules.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev clang llvm iasl nasm \
            gcc-aarch64-linux-gnu abootimg \
            python3 python3-distutils python3-pil python3-git gettext \
            cpio zip unzip

      - name: Build firmware
        run: |
          bash ./sweetbuild.sh

      - name: Build device tree variants
        run: |
          chmod +x package_variants.sh
          bash ./package_variants.sh

      - name: Verify each variant
        run: |
          set -e
          for img in out/*.img; do
            case "$img" in *-128m.img) continue ;; esac
            echo "=== $img ==="
            python3 tools/verify_boot_image.py "$img"
          done

      - name: Publish images into the repository
        # Downloading a workflow artifact needs a token carrying the actions:read
        # scope, and the only credential available here does not have it - the
        # artifact is listed through the API but its zip endpoint answers 404.
        #
        # Committing the images sidesteps that: `git pull` fetches them with no
        # authorisation at all, over the same transport that already works for
        # pushing. Only the unpadded images are committed; the 128 MB copies are
        # regenerable with tools/pad_to_partition.py.
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/*.img
          for img in out/*.img; do
            case "$img" in *-128m.img) continue ;; esac
            cp "$img" "dist/$(basename "$img")"
          done
          python3 tools/verify_boot_image.py dist/courbet-with-courbet-dtb.img >/dev/null
          ls -l dist/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          # [skip ci] stops this commit from starting another build, which would
          # otherwise commit its own output and never settle.
          git commit -m "Publish built images [skip ci]" || echo "images unchanged"
          # The ramdisk workflow pushes to the same branch and can land first,
          # which makes a plain push a non-fast-forward. Rebasing onto the remote
          # keeps both sets of files: they are different names under dist/.
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: courbet-uefi
          path: out/
          if-no-files-found: error
          retention-days: 30